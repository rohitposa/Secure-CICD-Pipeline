apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      automountServiceAccountToken: false
      containers:
      - name: product-service
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
            ephemeral-storage: "256Mi"
          limits:
            cpu: "500m"
            memory: "768Mi"
            ephemeral-storage: "512Mi"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  type: NodePort
  selector:
    app: product-service
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30081
