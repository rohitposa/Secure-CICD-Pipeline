services:
  product-service:
    image: ${DOCKER_USER}/product-service:${IMAGE_TAG}
    container_name: product-service
    ports:
      - "8081:8081"
    mem_limit: 768m
    restart: unless-stopped

  order-service:
    image: ${DOCKER_USER}/order-service:${IMAGE_TAG}
    container_name: order-service
    ports:
      - "8082:8082"
    mem_limit: 768m
    restart: unless-stopped
