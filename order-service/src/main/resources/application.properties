spring.application.name=order-service
server.port=8082

# Where product-service lives (override with env var PRODUCT_SERVICE_URL)
product.service.url=http://localhost:8081

# Release info and failure switch (override with env vars APP_VERSION / APP_FAIL)
app.version=v1
app.fail=false

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState,failSwitch
