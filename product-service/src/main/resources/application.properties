spring.application.name=product-service
server.port=8081

# Release info and failure switch (override with env vars APP_VERSION / APP_FAIL)
app.version=v1
app.fail=false

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState,failSwitch
